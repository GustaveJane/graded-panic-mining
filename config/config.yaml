# ============================================================
# G-PACE / PEMF — 中央配置文件
# ============================================================

project:
  name: "panic-emotion-mining-framework"
  paper_title: "From Binary Sentiment to Graded Panic"
  target_journal: "BDMA 2026"

# ---- Paths ----
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  feature_dir: "data/features"
  external_dir: "data/external"
  model_dir: "models"
  paper_dir: "paper"
  figure_dir: "paper/figures"
  table_dir: "paper/tables"
  label_dir: "labels"
  report_dir: "reports"
  experiment_dir: "experiments"
  legacy_dir: "scripts/legacy"

# ---- Data ----
data:
  total_posts: 65175112
  date_range: ["2019-12-01", "2020-12-31"]
  cutoff_date: "2020-01-23"
  spring_festival: "2020-01-25"
  human_to_human_date: "2020-01-20"

  # Temp file sources (original pipeline)
  temp_sources:
    - "temp19_1"
    - "temp1"
    - "temp2"
    - "temp3"
    - "temp4"
    - "temp5"
    - "temp6"

  # Raw CSV files
  raw_csv:
    daily_stats: "daily_stats_detail.csv"         # correct: has covid_posts
    daily_stats_old: "daily_stats_detail_2019_2020.csv"  # old: panic/total
    hourly: "bh_full_hourly.csv"

# ---- Classifier (PanicBERT) ----
classifier:
  model_name: "bert-base-chinese"
  max_length: 128
  batch_size: 16
  max_epochs: 20
  patience: 4
  learning_rate: 2e-5
  seed: 42
  train_split: 0.8

  # Data augmentation (NOTE: leakage found — test set was augmented)
  augmentation:
    enabled: true
    methods: ["synonym_replacement", "template_expansion", "intensity_rewrite", "noise_insertion"]
    back_translation: false  # Paper claimed but code did not implement

  # Paths
  paths:
    train_data: "data/processed/train_final.csv"
    test_data: "data/processed/test_final.csv"
    model_save: "models/panic_bert/"

# ---- GMM Stratification ----
gmm:
  n_components: 5
  n_init: 10
  max_iter: 1000
  random_state: 42
  bootstrap_resamples: 100

  # Threshold selection (HONEST disclosure)
  threshold_selection:
    method: "grid_search"    # Not "natural GMM boundaries" as stated in paper
    target_ratio: [0.2, 0.6, 0.2]  # 20-60-20 target
    search_range_around_gmm_boundaries: 0.05

  # True GMM posterior equal-probability points (for reference)
  true_posterior_equal_points: [0.4317, 0.6145, 0.8220, 0.9569]

  # Final selected thresholds (grid-searched to hit 20/60/20)
  final_thresholds: [0.4722, 0.9799]

  paths:
    gmm_model: "models/gmm/gmm_model.pkl"
    stratified_output: "data/processed/panic_stratified.csv"
    diagnostic_output: "experiments/results/gmm_diagnostics.csv"

# ---- Topic Modeling ----
topic:
  method: "BERTopic"
  hdbscan:
    min_cluster_size: 10
    min_samples: 5
    outlier_rate: 0.49   # known high outlier rate
  tier_crossed_samples_per_tier: 130

  paths:
    topic_model: "models/topic/topic_model.pkl"
    topic_output: "data/processed/topic_mapping.csv"

# ---- RDD ----
rdd:
  kernel: "triangular"
  weighting: "precision"  # weight = kernel × COVID-related post count
  main_bandwidth: 14
  robustness_bandwidths: [7, 21, 30]
  standard_error: "HAC"
  hac_maxlags: 3
  cutoff_date: "2020-01-23"
  cutoff_hour: "2020-01-23 10:00"

  # Donut RDD
  donut:
    enabled: true
    hole_start: "2020-01-20"
    hole_end: "2020-01-22"
    description: "Removes human-to-human → lockdown spike"

  # Placebo
  placebo_dates:
    - "2020-01-18"
    - "2020-01-19"
    - "2020-01-21"
    - "2020-01-22"
    - "2020-01-24"
    - "2020-01-25"  # Spring Festival
    - "2020-01-31"

  paths:
    output_dir: "experiments/results/rdd/"
    hourly_data: "data/raw/bh_full_hourly.csv"

# ---- Denominator ----
denominator:
  primary: "panic_coverage = panic_posts / covid_posts"
  old: "panic_rate = panic_posts / total_posts * 100"
  note: "Old denominator inflates pre-lockdown trend via topic penetration (corr=0.462 vs -0.127)"

# ---- Labels / Annotation ----
annotation:
  construct_validity:
    total_samples: 520
    tiers: 5
    raters: 3
    attention_checks: 20
    scale: "1-5 Likert"
    acceptance_threshold_spearman: 0.6
    partial_support_threshold: 0.4
    label_dir: "labels/construct_validity/"
